<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR Election Dashboard</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header / Navbar -->
        <header class="glass-header">
            <div>
                <div class="brand-title">CR Election Portal</div>
                <div class="brand-subtitle">Section Representative Live Voting</div>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="status-pill">
                    <span class="dot" id="live_dot"></span>
                    <span id="live_status_text">OFFLINE</span>
                </div>
                <a href="vote.html" class="btn-ios" id="vote_btn" style="display:none;">Cast Vote</a>
            </div>
        </header>

        <!-- Compact Hero Intro Section -->
        <section style="text-align: center; margin: 12px 0 10px 0; padding: 0 10px;">
            <h1 style="font-size: 28px; font-weight: 800; color: #1c1c1e; margin-bottom: 4px; line-height: 1.2;">
                CR Election For SWE 43-C
            </h1>
            <p style="font-size: 15px; color: #8e8e93; max-width: 600px; margin: 0 auto;">
                Cast your vote for the Class Representatives of Software Engineering batch 43-C.
            </p>
        </section>

        <!-- Candidate Cards Grid -->
        <main class="candidate-grid" id="candidate_container">
            <!-- Dynamically Loaded 3-Cards Per Row -->
        </main>

        <!-- Professional Footer -->
        <footer style="margin-top: 40px; padding: 20px 0; border-top: 1px solid rgba(0, 0, 0, 0.08); text-align: center; font-size: 14px; color: #8e8e93;">
            <p style="margin: 0;">
                Developed & Managed by 
                <a href="https://nifadhasan.com" target="_blank" rel="noopener noreferrer" style="color: #007aff; text-decoration: none; font-weight: 600;">
                    Nifad Hasan Eimu
                </a>
            </p>
        </footer>
    </div>

    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
